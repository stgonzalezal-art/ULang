name: mantener-despierto

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (mantiene despierto el servicio free)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantener-despierto
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la API de ULang
        run: |
          curl -sS --max-time 90 -o /dev/null \
            -w "estado HTTP: %{http_code}  tiempo: %{time_total}s\n" \
            https://ulang-vuhf.onrender.com/
