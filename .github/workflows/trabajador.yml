name: trabajador

on:
  schedule:
    - cron: "0 * * * *"   # cada hora (UTC)
  workflow_dispatch:        # tambien a mano desde la pestana Actions

permissions:
  contents: write

concurrency:
  group: trabajador
  cancel-in-progress: false

jobs:
  actualizar-catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Una pasada del trabajador (metadatos, sin IA)
        run: python trabajador.py --una-vez
      - name: Pipeline de propuestas (multi-fuente, genera 'propuesto')
        run: python proponer.py
      - name: Guardar cambios en el repo
        run: |
          git config user.name "ulang-bot"
          git config user.email "ulang-bot@users.noreply.github.com"
          git add datos/catalogo.json datos/estado_trabajador.json datos/propuestas
          git diff --staged --quiet || git commit -m "trabajador: actualiza catalogo y propuestas [skip ci]"
          git push
